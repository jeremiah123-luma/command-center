  :root{
    color-scheme:dark;
    --bg:#050505; --line:#262626; --ink:#F2F2F2; --ink2:#BDBDBD; --dim:rgba(255,255,255,.55);
    --o:#FF4D00; --grey:#E6E6E6; --y:#FFCD1A; --g:#00FF9B;
    --serif:"Petrona",Georgia,serif; --sans:"Outfit",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:16px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  h1{margin:8px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(32px,5vw,52px);letter-spacing:-.02em;line-height:1}
  h1 em{font-style:normal;color:var(--o)}
  .lede{margin:10px 0 0;color:var(--ink2);max-width:60ch}

  /* version picker */
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.07);color:#fff;
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font:500 13px var(--sans);cursor:pointer;display:flex;align-items:center;gap:7px}
  .chip b{font:500 10px var(--mono);color:var(--o)}
  .chip[aria-selected="true"]{background:#fff;color:#000;box-shadow:none}
  .chip:focus-visible,.btn:focus-visible{outline:2px solid var(--o);outline-offset:2px}

  .viewer{display:flex;flex-wrap:wrap;gap:24px 32px;align-items:flex-start}
  .info{flex:1 1 260px;display:flex;flex-direction:column;gap:12px;padding-top:4px}
  .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hd .n{font-family:var(--mono);font-size:11px;color:var(--o)}
  .hd h2{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.02em;line-height:1}
  .pick{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#000;background:var(--o);padding:2px 7px;border-radius:4px}
  .desc{margin:0;color:var(--ink2);max-width:46ch}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  .btn{height:40px;padding:0 18px;border-radius:999px;border:0;background:#fff;color:#000;font:500 14px var(--sans);cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .note{font-size:13px;color:var(--dim);margin:0}

  /* phone + app underneath */
  .ph{position:relative;flex:none;height:min(620px,64svh);aspect-ratio:290/600;max-width:100%;margin:0 auto;border-radius:40px;background:#000;overflow:hidden;isolation:isolate;
      box-shadow:0 0 0 1px #1d1d1d,0 0 0 7px #0c0c0c,0 0 0 8px #262626,0 30px 60px rgba(0,0,0,.6)}
  @media (min-width:700px){ .ph{margin:0} }
  .app{position:absolute;inset:0;padding:54px 18px 0;display:flex;flex-direction:column;gap:12px}
  .app .glow{position:absolute;inset:-20%;z-index:-1;background:radial-gradient(260px 300px at 82% 16%,rgba(255,150,70,.36),rgba(255,77,0,.28) 30%,rgba(120,28,0,.18) 58%,transparent 80%)}
  .app .lead{margin:0;font-family:var(--serif);font-size:20px;line-height:1.15;letter-spacing:-.01em}
  .app .lead em{font-style:normal;color:var(--o)}
  .app .tag{align-self:flex-start;margin-top:40px;font:500 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
  .app .disp{margin:0;font-family:var(--serif);font-size:30px;line-height:1.02;letter-spacing:-.02em}
  .app .row{height:44px;border-radius:22px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .app .dock{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:6px}
  .app .dock i{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .app .dock i:first-child{background:#fff}
  .ov{position:absolute;inset:0;background:#000;z-index:5;overflow:hidden}
  .ov canvas{position:absolute;inset:0;width:100%;height:100%}
  .ov .gl{opacity:0}
  .ov .pc{position:absolute;right:18px;bottom:22px;font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;z-index:3}
  .ov .glowb{position:absolute;left:50%;top:40%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;opacity:0;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,150,70,.42),rgba(255,77,0,.2) 42%,rgba(120,28,0,.08) 70%,transparent)}
  .logo{position:absolute;left:0;right:0;display:flex;justify-content:center;opacity:0;pointer-events:none;z-index:2}
  .logo .c1{color:var(--grey)} .logo .c2{color:var(--o)}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Command Center 2.0 · station wall start-ups</div>
    <h1>The station wall, <em>six ways.</em></h1>
    <p class="lede">Tap a version and it plays in the phone with sound. Only one plays at a time, and the wall is now drawn as one layer, so it runs smoothly.</p>
  </header>
  <div class="chips" id="chips" role="tablist" aria-label="Versions"></div>
  <div class="bar"><button class="btn" type="button" id="play">Play again</button><button class="btn ghost" type="button" id="snd">Sound on</button></div>
  <div class="viewer">
    <div class="ph" id="ph"></div>
    <div class="info">
      <div class="hd"><span class="n" id="vn"></span><h2 id="vname"></h2><span class="pick" id="vpick">my pick</span></div>
      <p class="desc" id="vdesc"></p>
      <p class="note">If you hear nothing, check that your phone's volume is up.</p>
    </div>
  </div>
</div>

<script>
(function(){

    this.hums.forEach(function(h){ self.srcs.push(hum(self.aBase+h[0]/1000,self.aBase+h[1]/1000,h[2])); });
    // at most one clack per 12ms (two if one is a landing), fed to the audio clock a little at a time
    var slots={}, q=this.ev.sort(function(a,b){ return a.ms-b.ms; }).filter(function(e){ var k=Math.round(e.ms/12), n=slots[k]||0; if(n>=(e.lock?2:1)) return false; slots[k]=n+1; return true; }), i=0;
    (function pump(){ if(self.dead) return; var el=(AC.currentTime-self.aBase)*1000;
      while(i<q.length&&q[i].ms<el+280){ var e=q[i++]; if(e.ms>el-10) clack(self.aBase+e.ms/1000,e.vol,e.pan,e.pitch,e.lock); }
      if(i<q.length) self.timers.push(setTimeout(pump,80)); })(); };
  Run.prototype.stop=function(){ this.dead=true; this.timers.forEach(clearTimeout); cancelAnimationFrame(this.raf); this.srcs.forEach(function(s){ try{ s.stop(); }catch(e){} }); };

  function seqTo(target,minFlips){ var ti=SET.indexOf(target), si=(ti-minFlips-Math.floor(Math.random()*7)+SET.length*4)%SET.length, out=[];
    for(var i=si;;i=(i+1)%SET.length){ out.push(SET[i]); if(i===ti&&out.length>minFlips) break; } return out; }

  /* ── the wall, drawn on one canvas ── */
  var ATL={};
  function rr(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
  // every letter pre-drawn once per colour, so each frame is just image copies
  function atlas(col,tw,th,r,fs){ var key=col+tw+"x"+th; if(ATL[key]) return ATL[key];
    var c=document.createElement("canvas"); c.width=SET.length*tw; c.height=th; var x=c.getContext("2d"), hs=th/2;
    x.font="700 "+fs+"px Sligoil, monospace"; x.textAlign="center"; x.textBaseline="middle";
    for(var i=0;i<SET.length;i++){ var ox=i*tw;
      if(SET[i]==="#"){ x.fillStyle=col; rr(x,ox,0,tw,th,r); x.fill(); continue; }
      var g1=x.createLinearGradient(0,0,0,hs); g1.addColorStop(0,"#1e1e1e"); g1.addColorStop(1,"#151515"); x.fillStyle=g1; rr(x,ox,0,tw,th,r); x.fill();
      x.save(); x.beginPath(); x.rect(ox,hs,tw,hs); x.clip(); var g2=x.createLinearGradient(0,hs,0,th); g2.addColorStop(0,"#0f0f0f"); g2.addColorStop(1,"#181818"); x.fillStyle=g2; rr(x,ox,0,tw,th,r); x.fill(); x.restore();
      if(SET[i]!==" "){ x.fillStyle=col; x.fillText(SET[i],ox+tw/2,hs+fs*.04); } }
    return ATL[key]=c; }

  function appHTML(){ return '<div class="app"><div class="glow"></div><p class="lead"><em>Leave by 7:05.</em> Physics I at 8:30 in Science Hall 105.</p><span class="tag">Next up · PHYS 101A</span><p class="disp">Lab Report 2 is due Tuesday.</p><div class="row"></div><div class="row"></div><div class="dock"><i></i><i></i><i></i><i></i></div></div>'; }
  function stage(ph,cols,rows,kind){
    ph.innerHTML=appHTML()+'<div class="ov"><div class="glowb"></div><canvas class="gl"></canvas><canvas class="cv"></canvas><span class="pc">0%</span></div>';
    var ov=ph.querySelector(".ov"), W=ov.clientWidth, H=ov.clientHeight, dpr=Math.min(2,window.devicePixelRatio||1);
    var ratio=kind==="px2"?30/38:18/22, gap=3, aw=W-16, ah=H-54;
    var tw=Math.min((aw-gap*(cols-1))/cols,(ah-gap*(rows-1))/rows*ratio), th=tw/ratio;
    var TW=Math.round(tw*dpr), TH=Math.round(th*dpr/2)*2, G=Math.round(gap*dpr), gw=cols*TW+(cols-1)*G, gh=rows*TH+(rows-1)*G;
    var ox=Math.round((W*dpr-gw)/2), oy=Math.round(14*dpr+(ah*dpr-gh)/2);
    var cv=ov.querySelector(".cv"), gl=ov.querySelector(".gl"); [cv,gl].forEach(function(c){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); });
    var s={ph:ph,ov:ov,cv:cv,gl:gl,ctx:cv.getContext("2d"),gx:gl.getContext("2d"),glow:ov.querySelector(".glowb"),pc:ov.querySelector(".pc"),
      cols:cols,rows:rows,W:W,H:H,dpr:dpr,TW:TW,TH:TH,r:Math.max(1,Math.round(TH*(kind==="px2"?4/38:2/22))),fs:TH*(kind==="px2"?18/38:12/22),tiles:[],end:1};
    for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) s.tiles.push({c:c,r:r,x:ox+c*(TW+G),y:oy+r*(TH+G),flips:[],fi:0,init:{ch:" ",col:DIM}});
    return s; }
  function A(s,col){ return atlas(col,s.TW,s.TH,s.r,s.fs); }
  function half(ctx,s,col,ch,bottom,x,y,h){ var hs=s.TH/2; ctx.drawImage(A(s,col),SET.indexOf(ch)*s.TW,bottom?hs:0,s.TW,hs,x,y,s.TW,h); }
  function drawTile(ctx,s,T,now){ var TW=s.TW, hs=s.TH/2, x=T.x, y=T.y, mid=y+hs, alpha=1, sy=1;
    if(T.away&&now>=T.away.t){ var p=Math.min(1,(now-T.away.t)/T.away.d); if(p>=1) return; var e=p*p; alpha=1-e; sy=Math.max(0,Math.cos(e*1.75)); if(sy<.02) return; }
    if(T.fade&&now>=T.fade.t){ var q=Math.min(1,(now-T.fade.t)/T.fade.d); alpha*=1-q*q; if(alpha<=.01) return; }
    var F=T.flips; while(T.fi<F.length&&now>=F[T.fi].t+F[T.fi].d) T.fi++;
    var cur=(T.fi<F.length&&now>=F[T.fi].t)?F[T.fi]:null, rest=T.fi>0?{ch:F[T.fi-1].b,col:F[T.fi-1].bc}:T.init;
    var moved=alpha<1||sy<1; if(moved){ ctx.save(); ctx.globalAlpha=alpha; ctx.translate(0,mid); ctx.scale(1,sy); ctx.translate(0,-mid); }
    if(!cur){ half(ctx,s,rest.col,rest.ch,0,x,y,hs); half(ctx,s,rest.col,rest.ch,1,x,mid,hs); }
    else { var k=(now-cur.t)/cur.d;
      half(ctx,s,cur.bc,cur.b,0,x,y,hs); half(ctx,s,cur.ac,cur.a,1,x,mid,hs);
      ctx.fillStyle="rgba(0,0,0,"+(.45*Math.sin(k*Math.PI)).toFixed(3)+")"; ctx.fillRect(x,mid,TW,hs);
      if(k<.5){ var a=Math.cos(k*Math.PI), h1=hs*a; half(ctx,s,cur.ac,cur.a,0,x,mid-h1,h1); ctx.fillStyle="rgba(0,0,0,"+(.6*(1-a)).toFixed(3)+")"; ctx.fillRect(x,mid-h1,TW,h1); }
      else { var b=-Math.cos(k*Math.PI), h2=hs*b; half(ctx,s,cur.bc,cur.b,1,x,mid,h2); ctx.fillStyle="rgba(0,0,0,"+(.55*(1-b)).toFixed(3)+")"; ctx.fillRect(x,mid,TW,h2); } }
    ctx.fillStyle="#000"; ctx.fillRect(x,mid-s.dpr*.5,TW,s.dpr);
    if(moved) ctx.restore(); }
  function go(s,run){ var ctx=s.ctx, last=-1;
    (function frame(){ if(run.dead) return; var now=performance.now()-run.t0;
      ctx.clearRect(0,0,s.cv.width,s.cv.height); for(var i=0;i<s.tiles.length;i++) drawTile(ctx,s,s.tiles[i],now);
      var pct=Math.round(Math.max(0,Math.min(1,now/s.end))*100); if(pct!==last){ s.pc.textContent=pct+"%"; last=pct; }
      if(now<run.until) run.raf=requestAnimationFrame(frame); })();
    run.startAudio(); }

  /* the glow under lit tiles, drawn once when they land */
  function landed(T,ms){ var L=null; for(var i=0;i<T.flips.length;i++){ if(T.flips[i].t+T.flips[i].d<=ms) L=T.flips[i]; } return L; }
  function glowAt(s,run,at,from){ run.at(function(){ var x=s.gx; x.clearRect(0,0,s.gl.width,s.gl.height); x.shadowBlur=12*s.dpr;
      s.tiles.forEach(function(T){ var L=landed(T,at+5); if(!L||L.b!=="#"||L.bc===DIM) return; x.shadowColor=L.bc; x.fillStyle=L.bc; x.fillRect(T.x+1,T.y+1,s.TW-2,s.TH-2); });
      s.gl.animate([{opacity:from||0},{opacity:1}],{duration:600,fill:"forwards"}); },at); }
  function lightUp(s,at,top){ s.glow.style.top=top||"46%"; s.glow.animate([{opacity:0,transform:"scale(.5)"},{opacity:.95,transform:"scale(1)"}],{duration:900,delay:at,easing:E,fill:"forwards"}); }
  function handoff(s,at,run){ run.at(function(){
      s.ov.animate([{opacity:1},{opacity:0}],{duration:420,easing:"ease-in",fill:"forwards"});
      [].forEach.call(s.ph.querySelectorAll(".app > *:not(.glow):not(.dock), .app .dock i"),function(el,i){ el.animate([{opacity:0,transform:"translateY(12px)",filter:"blur(5px)"},{opacity:1,transform:"none",filter:"blur(0)"}],{duration:600,delay:120+i*60,easing:E,fill:"backwards"}); }); },at);
    run.until=at+500; }

  /* pixel letters on the wall */
  var GL={ C:["01110","10001","10000","10000","10000","10001","01110"],
    "7":["111","001","010","010","010"], ":":["0","1","0","1","0"], "0":["111","101","101","101","111"], "5":["111","100","111","001","111"] };
  function paint(parts){ var m={}; parts.forEach(function(p){ var g=GL[p.ch]; for(var y=0;y<g.length;y++) for(var x=0;x<g[y].length;x++) if(g[y][x]==="1") m[(p.x+x)+","+(p.y+y)]=p.col; }); return function(c,r){ return m[c+","+r]||null; }; }
  function LOGO(r0,x0){ return [{ch:"C",x:x0,y:r0,col:"#E6E6E6"},{ch:"C",x:x0+6,y:r0,col:"#FF4D00"}]; }
  function centre(c,r,cx,cy,k){ return 60+Math.hypot(c-cx,r-cy)*(k||62)+Math.random()*80; }
  function build(s,run,lit,order,o){ o=o||{}; var end=0, mc=(s.cols-1)/2;
    s.tiles.forEach(function(T){ var col=lit(T.c,T.r), tc=col||DIM, q=seqTo(col?"#":" ",(o.min||6)+Math.floor(Math.random()*(o.spread||7)));
      T.init={ch:q[0],col:tc};
      end=Math.max(end,run.flips(T,q,order(T.c,T.r),tc,{vol:o.vol||.06,pan:(T.c-mc)/mc,pitch:o.pitch||1.25,sparse:o.sparse||.12,lock:!!col})); });
    run.hum(0,end+100,o.hum||.07); s.end=end; return end; }

  var V={};
  V.burst=function(ph,run){ var s=stage(ph,13,22,"px"), end=build(s,run,paint(LOGO(7,1)),function(c,r){ return centre(c,r,6,10); });
    glowAt(s,run,end+60); lightUp(s,end+100); handoff(s,end+1000,run); go(s,run); };
  V.cascade=function(ph,run){ var s=stage(ph,13,22,"px"), end=build(s,run,paint(LOGO(7,1)),function(c,r){ return 40+r*58+c*9+Math.random()*30; },{min:5,spread:5,sparse:.1});
    glowAt(s,run,end+60); lightUp(s,end+100); handoff(s,end+1000,run); go(s,run); };
  V.chunky=function(ph,run){ var s=stage(ph,7,15,"px2"), m1=paint([{ch:"C",x:1,y:0,col:"#E6E6E6"}]), m2=paint([{ch:"C",x:1,y:8,col:"#FF4D00"}]);
    var end=build(s,run,function(c,r){ return m1(c,r)||m2(c,r); },function(c,r){ return centre(c,r,3,7,80); },{vol:.14,pitch:.9,sparse:.35,min:5,spread:6,hum:.08});
    glowAt(s,run,end+60); lightUp(s,end+100,"44%"); handoff(s,end+1000,run); go(s,run); };
  V.tologo=function(ph,run){ var s=stage(ph,13,22,"px"), end=build(s,run,paint(LOGO(7,1)),function(c,r){ return centre(c,r,6,10); });
    glowAt(s,run,end+60);
    var H=end+420, k=s.W/290, logo=document.createElement("div"); logo.className="logo";
    logo.style.cssText="top:calc(46% - "+(60*k)+"px);font:700 "+(110*k)+"px/"+(120*k)+"px 'Sligoil',monospace";
    logo.innerHTML='<span class="c1">C</span><span class="c2">C</span>'; s.ov.appendChild(logo);
    s.tiles.forEach(function(T){ var L=T.flips[T.flips.length-1], on=L&&L.b==="#"; T.fade={t:H+(on?120:Math.random()*120),d:on?520:360}; });
    run.at(function(){ s.gl.animate([{opacity:1},{opacity:0}],{duration:520,fill:"forwards"}); },H+120);
    logo.animate([{opacity:0,transform:"scale(1.08)",filter:"blur(6px)"},{opacity:1,transform:"scale(1)",filter:"blur(0)"}],{duration:560,delay:H+160,easing:E,fill:"forwards"});
    lightUp(s,H+120); handoff(s,H+1150,run); go(s,run); };
  V.away=function(ph,run){ var s=stage(ph,13,22,"px"), end=build(s,run,paint(LOGO(7,1)),function(c,r){ return centre(c,r,6,10); });
    glowAt(s,run,end+60); lightUp(s,end+100);
    var H=end+650, span=0;
    s.tiles.forEach(function(T){ var d=T.r*34+Math.abs(T.c-6)*10+Math.random()*40; span=Math.max(span,d); T.away={t:H+d,d:300};
      if(Math.random()<.14) run.sfx(H+d+150,.05,(T.c-6)/6,1.3,false); });
    run.at(function(){
      s.ov.animate([{backgroundColor:"rgba(0,0,0,1)"},{backgroundColor:"rgba(0,0,0,0)"}],{duration:span+300,easing:"linear",fill:"forwards"});
      s.glow.animate([{opacity:.95},{opacity:0}],{duration:span+300,fill:"forwards"});
      s.gl.animate([{opacity:1},{opacity:0}],{duration:span*.8,fill:"forwards"});
      s.pc.animate([{opacity:1},{opacity:0}],{duration:250,fill:"forwards"});
      [].forEach.call(ph.querySelectorAll(".app > *:not(.glow):not(.dock), .app .dock i"),function(el,i){ el.animate([{opacity:0,filter:"blur(4px)"},{opacity:1,filter:"blur(0)"}],{duration:500,delay:80+i*70,easing:E,fill:"backwards"}); });
    },H);
    run.at(function(){ s.ov.style.display="none"; },H+span+420); run.until=H+span+400; go(s,run); };
  V.time=function(ph,run){ var s=stage(ph,13,22,"px"), end=build(s,run,paint(LOGO(4,1)),function(c,r){ return centre(c,r,6,7,60); });
    glowAt(s,run,end+60);
    var time=paint([{ch:"7",x:0,y:13,col:"#FF4D00"},{ch:":",x:4,y:13,col:"#FF4D00"},{ch:"0",x:6,y:13,col:"#FF4D00"},{ch:"5",x:10,y:13,col:"#FF4D00"}]);
    var H=end+500, end2=H;
    s.tiles.forEach(function(T){ if(T.r<12) return; var col=time(T.c,T.r)||((T.r===19&&T.c>=2&&T.c<=10)?"#00FF9B":null); if(!col) return;
      var q=seqTo("#",4+Math.floor(Math.random()*5)); q[0]=" ";
      end2=Math.max(end2,run.flips(T,q,H+(T.r-12)*40+T.c*14,col,{vol:.08,pan:(T.c-6)/6,pitch:1.1,sparse:.35,lock:true})); });
    run.hum(H,end2+100,.06); s.end=end2;
    glowAt(s,run,end2+40,.5); lightUp(s,end2+60); handoff(s,end2+1100,run); go(s,run); };

  var IDEAS=[
    {id:"away",n:"01",name:"Flip away",pick:true,desc:"The wall builds the CC from the middle out and holds for a beat. Then every tile flips away from top to bottom, and the app is right behind them. The start-up becomes the doorway into the app."},
    {id:"burst",n:"02",name:"Center burst",desc:"The one you liked, refined. The clatter spreads from the middle out, and the lit tiles glow once they land. Then the light comes up and it fades into the app."},
    {id:"tologo",n:"03",name:"Wall to logo",desc:"The pixel CC forms, then the wall melts away and the pixel letters sharpen into your real Sligoil logo in the same spot."},
    {id:"time",n:"04",name:"Good morning",desc:"CC forms at the top. Then the lower half clatters again to show your leave time, 7:05, with a green on-time bar, so the wall tells you something before you're in."},
    {id:"cascade",n:"05",name:"Top-down",desc:"Rows refresh one after another from the top, like a real board updating its list. It's calmer and more orderly than the burst."},
    {id:"chunky",n:"06",name:"Chunky",desc:"Fewer, bigger flaps with a deeper, heavier clack. The two Cs are stacked, grey over orange. It's the most physical-feeling one."}
  ];
  var ph=document.getElementById("ph"), chips=document.getElementById("chips"), cur=IDEAS[0], run=null;
  chips.innerHTML=IDEAS.map(function(it,i){ return '<button class="chip" type="button" role="tab" data-i="'+i+'" aria-selected="'+(i===0)+'"><b>'+it.n+'</b>'+it.name+'</button>'; }).join("");
  function show(it){ cur=it; document.getElementById("vn").textContent=it.n; document.getElementById("vname").textContent=it.name; document.getElementById("vdesc").textContent=it.desc;
    document.getElementById("vpick").hidden=!it.pick;
    [].forEach.call(chips.children,function(c){ c.setAttribute("aria-selected",String(IDEAS[+c.dataset.i]===it)); }); }
  function play(sound){ if(sound&&SOUND&&AC&&AC.state!=="running"){ var go2=function(){ play2(true); }; AC.resume().then(go2,go2); return; } play2(sound); }
  function play2(sound){ if(run) run.stop(); ph.getAnimations({subtree:true}).forEach(function(a){ a.cancel(); }); run=new Run(sound); V[cur.id](ph,run); }
  chips.addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; audioInit(); show(IDEAS[+b.dataset.i]); try{ b.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"}); }catch(x){} play(true); });
  document.getElementById("play").addEventListener("click",function(){ audioInit(); play(true); });
  document.getElementById("snd").addEventListener("click",function(){ SOUND=!SOUND; this.textContent=SOUND?"Sound on":"Sound off"; if(SOUND) audioInit(); });
  show(cur); ph.innerHTML=appHTML();
  function start(){ play(false); }
  if(document.fonts&&document.fonts.load) document.fonts.load('700 20px "Sligoil"').then(start,start); else start();
})();
</script>
