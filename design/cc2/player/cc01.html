  /* Layout: one full-screen stage with the player centred; a quiet caption on top, finish chips and one hint line at the bottom. */
  :root{
    --stage:#0a0908; --ink:#F2F2F2; --ink2:#BDBDBD; --dim:rgba(255,255,255,.5);
    --o:#FF4D00; --line:rgba(255,255,255,.16);
    --serif:"Petrona",Georgia,serif; --sans:"Outfit",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--stage);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c.drag{cursor:grabbing}
  .cap{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
  .cap .k{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .cap h1{margin:6px 0 0;font:400 clamp(26px,5vw,38px)/1 var(--serif);letter-spacing:-.02em}
  .cap h1 em{font-style:normal;color:var(--o)}
  .pill{pointer-events:auto;white-space:nowrap;height:34px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.07);color:#fff;box-shadow:inset 0 0 0 1px var(--line);font:500 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
  .pill[aria-pressed="true"]{background:#fff;color:#000;box-shadow:none}
  .pill:focus-visible{outline:2px solid var(--o);outline-offset:2px}
  .foot{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  .fin{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;pointer-events:auto}
  .fin .lab{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-right:4px}
  .fin .pill{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 8px}
  .fin .sw{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  .hint{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:center}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .loading{position:fixed;left:0;right:0;top:46%;text-align:center;font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);pointer-events:none;transition:opacity .4s}
  .loading .dots{display:inline-block;width:3ch;text-align:left}
  .fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink2);font:400 15px/1.5 var(--sans)}
</style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let dotN = 1; const dotsEl = document.getElementById("dots"), dotTimer = setInterval(() => { dotN = dotN % 3 + 1; dotsEl.textContent = ".".repeat(dotN); }, 400);
function doneLoading(){ clearInterval(dotTimer); document.getElementById("ld").style.opacity = 0; pod.visible = true; }
THREE.ColorManagement.enabled = false;

const canvas = document.getElementById("c");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false, powerPreference:"high-performance" }); }
catch(e){ document.body.insertAdjacentHTML("beforeend",'<div class="fail">This concept needs WebGL, and this browser has it turned off.</div>'); throw e; }
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const DPR = Math.min(2, window.devicePixelRatio || 1);
renderer.setPixelRatio(DPR);

/* ── made-up library (the app feeds Spotify in here) ── */
const TRACKS = [
  { t:"Leave by 7:05", a:"The Commuters", d:212, hue:"#FF4D00" },
  { t:"Science Hall Nights", a:"Hallway Echo", d:248, hue:"#FFB020" },
  { t:"Route 18", a:"Merge Left", d:301, hue:"#FF6A3D" },
  { t:"Sunroom", a:"The Late Shift", d:186, hue:"#E6E6E6" }
];
const S = { i:0, playing:true, pos:38, vol:62, volUntil:0, menu:false, sel:0 };

/* ── finishes ── */
const FIN = {
  classic: { body:{c:"#F4F5F6",spec:.55,shin:120,env:.7}, back:"#D5D8DC", split:0.0, disc:{c:"#D2D4D6",spec:.05,shin:10,env:.05}, btn:{c:"#FAFBFC",spec:.45,shin:120,env:.4}, ring:"#CFD2D6", sw:"#FF4D00", icon:"#8E8E8C", tick:"rgba(0,0,0,.25)", logoPlate:null },
  ink:    { drawIcons:true, body:{c:"#1c1a19",spec:.32,shin:70,env:.9}, disc:{c:"#1e1c1b",spec:.1,shin:18,env:.25}, btn:{c:"#F3F1EE",spec:.55,shin:140,env:1}, ring:"#FF4D00", sw:"#FF4D00", icon:"#CFC9C3", tick:"rgba(255,255,255,.28)", logoPlate:null },
  signal: { body:{c:"#F04E00",spec:.4,shin:90,env:.75}, disc:{c:"#1e1c1b",spec:.1,shin:18,env:.25}, btn:{c:"#F3F1EE",spec:.55,shin:140,env:1}, ring:"#141414", sw:"#141414", icon:"#E6E6E6", tick:"rgba(0,0,0,.4)", logoPlate:null },
  paper:  { body:{c:"#E9E4DE",spec:.25,shin:45,env:.55}, disc:{c:"#1e1c1b",spec:.1,shin:18,env:.25}, btn:{c:"#FF4D00",spec:.5,shin:120,env:.8}, ring:"#FF4D00", sw:"#FF4D00", icon:"#CFC9C3", tick:"rgba(0,0,0,.3)", logoPlate:null }
};
let F = FIN.classic;

/* ── scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);

// surface shader: soft key + warm fill from the stage light, a studio highlight, reflections at grazing angles,
// and a light halftone only in the deepest shadow so it still reads as printed
const inkVS = `varying vec3 vN; varying vec3 vV;
  void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = -mv.xyz; gl_Position = projectionMatrix*mv; }`;
const inkFS = `uniform vec3 uBase; uniform float uSpec; uniform float uShin; uniform float uEnv; uniform float uDotPx; uniform float uDotK;
  varying vec3 vN; varying vec3 vV;
  void main(){
    vec3 N = normalize(vN), V = normalize(vV);
    vec3 L1 = normalize(vec3(-0.45,0.7,0.6)), L2 = normalize(vec3(0.8,0.35,0.3));
    float key = max(dot(N,L1),0.0), hemi = 0.5+0.5*N.y;
    vec3 col = uBase*(0.16 + 0.72*key + 0.2*hemi) + uBase*vec3(1.0,0.42,0.16)*0.35*max(dot(N,L2),0.0);
    vec3 H = normalize(L1+V);
    col += vec3(1.0)*pow(max(dot(N,H),0.0), uShin)*uSpec;
    vec3 R = reflect(-V,N);
    vec3 env = mix(vec3(0.02), vec3(0.95,0.5,0.25)*0.55, smoothstep(-0.3,0.9,R.x*0.6+R.y*0.5));
    env += vec3(1.0)*exp(-pow((R.x+0.35)*3.2,2.0)-pow((R.y-0.55)*2.4,2.0))*0.9;
    float fr = 0.04 + 0.96*pow(1.0-max(dot(N,V),0.0), 5.0);
    col = mix(col, env, clamp(fr*uEnv,0.0,1.0));
    vec2 p = gl_FragCoord.xy/uDotPx; p = mat2(0.7071,-0.7071,0.7071,0.7071)*p;
    float d = length(fract(p)-0.5), r = clamp((0.3-key)*1.0, 0.0, 0.3);
    col = mix(col, col*0.35, (1.0-smoothstep(r-0.05, r, d))*step(0.03,r)*uDotK);
    gl_FragColor = vec4(col,1.0);
  }`;
const C = h => new THREE.Color(h);
function mat(s, dotK){ return new THREE.ShaderMaterial({ vertexShader:inkVS, fragmentShader:inkFS, uniforms:{
  uBase:{value:C(s.c)}, uSpec:{value:s.spec}, uShin:{value:s.shin}, uEnv:{value:s.env}, uDotPx:{value:4.5*DPR}, uDotK:{value:dotK==null?.35:dotK} } }); }
function setMat(m, s){ const u = m.uniforms; u.uBase.value.set(s.c); u.uSpec.value = s.spec; u.uShin.value = s.shin; u.uEnv.value = s.env; }
// body: the same surface, plus a polished-steel back half (Classic) that mirrors the warm stage
const bodyVS = `varying vec3 vN; varying vec3 vV; varying float vZ;

  sx.textAlign = "right"; sx.fillText((S.menu ? S.sel+1 : S.i+1)+" / "+TRACKS.length, 610, 44); sx.textAlign = "left";
  if (!S.playing && !S.menu){ sx.fillStyle = "#FF4D00"; sx.fillRect(30, 30, 4, 18); }
  if (S.menu){
    TRACKS.forEach((t, k) => { const y = 70 + k*90, on = k === S.sel;
      if (on){ sx.fillStyle = "#FF4D00"; sx.fillRect(18, y, 604, 80); }
      sx.fillStyle = on ? "#000" : "#F2F2F2"; sx.font = "500 34px 'Petrona', Georgia, serif"; sx.fillText(t.t, 34, y+38);
      sx.fillStyle = on ? "rgba(0,0,0,.65)" : "rgba(255,255,255,.45)"; sx.font = "500 16px 'Geist Mono', monospace"; sx.fillText(t.a.toUpperCase()+"  ·  "+mmss(t.d), 34, y+64);
      if (k === S.i){ sx.fillStyle = on ? "#000" : "#FF4D00"; sx.beginPath(); sx.arc(598, y+40, 6, 0, 7); sx.fill(); } });
  } else {
    art(30, 74, 184, tr);
    const lines = wrap(tr.t, 370, "500 46px 'Petrona', Georgia, serif");
    sx.fillStyle = "#F2F2F2"; lines.forEach((l, k) => sx.fillText(l, 238, 118 + k*50));
    sx.font = "500 18px 'Geist Mono', monospace"; sx.fillStyle = "rgba(255,255,255,.5)"; sx.fillText(tr.a.toUpperCase(), 240, 118 + lines.length*50 + 2);
    if (now < S.volUntil){
      sx.fillStyle = "rgba(255,255,255,.5)"; sx.font = "500 18px 'Geist Mono', monospace"; sx.fillText("VOLUME", 30, 330);
      sx.textAlign = "right"; sx.fillStyle = "#FF4D00"; sx.font = "700 30px 'Geist Mono', monospace"; sx.fillText(String(Math.round(S.vol)), 610, 332); sx.textAlign = "left";
      const n = 24, on = Math.round(S.vol/100*n); for (let k = 0; k < n; k++){ sx.fillStyle = k < on ? "#FF4D00" : "rgba(255,255,255,.12)"; sx.fillRect(30 + k*24.2, 352, 18, 44); }
    } else {
      sx.fillStyle = "rgba(255,255,255,.14)"; sx.fillRect(30, 364, 580, 6);
      sx.fillStyle = "#FF4D00"; sx.fillRect(30, 364, 580*Math.min(1, S.pos/tr.d), 6);
      sx.font = "500 19px 'Geist Mono', monospace"; sx.fillStyle = "rgba(255,255,255,.7)";
      sx.fillText(mmss(S.pos), 30, 408); sx.textAlign = "right"; sx.fillText("-"+mmss(tr.d - S.pos), 610, 408); sx.textAlign = "left";
    }
  }
  scTex.needsUpdate = true;
}

/* ── sound: a small detent tick ── */
let AC = null, CLICKS = false;
function tick(v){ if (!CLICKS) return; if (!AC){ const K = window.AudioContext || window.webkitAudioContext; if (!K) return; AC = new K(); }
  if (AC.state === "suspended") AC.resume();
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = "square"; o.frequency.setValueAtTime(2300, t); o.frequency.exponentialRampToValueAtTime(900, t+0.012);
  g.gain.setValueAtTime(v||0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.02); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.025); }
document.getElementById("snd").addEventListener("click", function(){ CLICKS = !CLICKS; this.setAttribute("aria-pressed", String(CLICKS)); this.textContent = CLICKS ? "Clicks on" : "Clicks off"; if (CLICKS) tick(0.08); });

/* ── finishes ── */
let currentFinish = "classic";
function applyFinish(name){
  F = FIN[name]; currentFinish = name;
  setPBR(bodyMat, F.body.c); setPBR(discMat, F.disc.c); setPBR(ringMat, F.ring); setPBR(btnMat, F.btn.c); setPBR(swMat, F.sw);
  bodyMat.roughness = name === "ink" ? .3 : .42; seam.position.z = 0;
  drawWheel(); wTex.needsUpdate = true; drawTicks(); tTex.needsUpdate = true; drawBack(); bTex.needsUpdate = true;
  document.querySelectorAll(".fin .pill").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === name)));
  try { localStorage.setItem("cc01.look", name); } catch(e){}
}
document.querySelectorAll(".fin .pill").forEach(b => b.addEventListener("click", () => applyFinish(b.dataset.f)));

/* ── actions: feedback is the button lighting up, the wheel rocking, and the colour plates slipping a little ── */
const live = document.getElementById("live");
let shift = 0, tilt = { x:0, y:0 }, press = 0;
function feel(which){ lit = which; litUntil = performance.now() + 420; drawWheel(); wTex.needsUpdate = true; shift = 1;
  const a = { menu:[1,0], play:[-1,0], next:[0,1], prev:[0,-1] }[which] || [0,0]; tilt.x = -a[0]*0.09; tilt.y = a[1]*0.09; }
function say(){ const t = TRACKS[S.i]; live.textContent = (S.playing ? "Playing " : "Paused ") + t.t + " by " + t.a; }
function go(k){ S.i = (k + TRACKS.length) % TRACKS.length; S.pos = 0; S.sel = S.i; say(); }
const A = {
  next(){ go(S.i+1); feel("next"); tick(0.09); },
  prev(){ if (S.pos > 4) S.pos = 0; else go(S.i-1); feel("prev"); tick(0.09); },
  toggle(fromBtn){ if (S.menu){ go(S.sel); S.menu = false; S.playing = true; } else S.playing = !S.playing;
    say(); tick(0.09); if (fromBtn){ press = 1; shift = 0.7; feel("center"); } else feel("play"); },
  menu(){ S.menu = !S.menu; S.sel = S.i; feel("menu"); tick(0.07); },
  vol(d){ S.vol = Math.max(0, Math.min(100, S.vol + d)); S.volUntil = performance.now() + 1400; }
};

/* ── pointer ── */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let mode = null, lastAng = 0, acc = 0, spun = 0, sx0 = 0, lx = 0, ly = 0, yaw = 0, pitch = 0, tYaw = 0, tPitch = 0;
function hitWheel(e){
  const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera); const h = ray.intersectObjects([disc, btn], false)[0]; if (!h) return null;
  const p = wheel.worldToLocal(h.point.clone()); return { r:Math.hypot(p.x,p.y), a:Math.atan2(p.y,p.x) };
}
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); sx0 = lx = e.clientX; ly = e.clientY;
  if (CLICKS && AC && AC.state === "suspended") AC.resume();
  const w = hitWheel(e);
  if (w && w.r < BR+0.02){ mode = "btn"; press = 0.6; }
  else if (w){ mode = "wheel"; lastAng = w.a; acc = 0; spun = 0; }
  else { mode = "turn"; canvas.classList.add("drag"); }
});
canvas.addEventListener("pointermove", e => {
  if (mode === "wheel"){
    const w = hitWheel(e); if (!w) return;
    let d = w.a - lastAng; if (d > Math.PI) d -= 2*Math.PI; if (d < -Math.PI) d += 2*Math.PI; lastAng = w.a;
    acc += d; spun += Math.abs(d);
    const STEP = 0.26;                                         // a detent every 15°
    while (Math.abs(acc) >= STEP){ const dir = acc < 0 ? 1 : -1; acc += dir*STEP;         // clockwise = up
      if (S.menu){ S.sel = (S.sel + dir + TRACKS.length) % TRACKS.length; } else A.vol(dir*3); tick(0.045); }
  } else if (mode === "turn"){
    tYaw += (e.clientX-lx)*0.012; tPitch += (e.clientY-ly)*0.008; tPitch = Math.max(-0.6, Math.min(0.6, tPitch)); lx = e.clientX; ly = e.clientY;
  }
});
function end(e){
  if (mode === "wheel" && spun < 0.18){
    const deg = (lastAng*180/Math.PI + 360) % 360;
    if (deg >= 45 && deg < 135) A.menu(); else if (deg >= 135 && deg < 225) A.prev(); else if (deg >= 225 && deg < 315) A.toggle(); else A.next();
  } else if (mode === "btn"){ const w = hitWheel(e); if (w && w.r < BR+0.04) A.toggle(true); }
  else if (mode === "turn"){ const q = Math.round(tYaw/Math.PI)*Math.PI; tYaw = Math.abs(tYaw - q) < 0.9 ? q : tYaw; tPitch = 0; if (Math.abs(e.clientX-sx0) < 4) tYaw = Math.round(tYaw/(2*Math.PI))*2*Math.PI; }
  mode = null; canvas.classList.remove("drag");
}
canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end);
window.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button")) return;
  if (e.key === " "){ e.preventDefault(); A.toggle(); } else if (e.key === "ArrowRight") A.next(); else if (e.key === "ArrowLeft") A.prev();
  else if (e.key === "ArrowUp"){ e.preventDefault(); S.menu ? (S.sel = (S.sel+TRACKS.length-1)%TRACKS.length) : A.vol(5); } else if (e.key === "ArrowDown"){ e.preventDefault(); S.menu ? (S.sel = (S.sel+1)%TRACKS.length) : A.vol(-5); }
  else if (e.key === "m" || e.key === "Escape") A.menu();
});

/* ── post: the colour plates sit slightly off register, like a printed comic ── */
const rt = new THREE.WebGLRenderTarget(1, 1, { samples:4 });
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const post = new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShaderMaterial({ uniforms:{ t:{value:rt.texture}, uS:{value:0}, uRes:{value:new THREE.Vector2(1,1)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }`,
  fragmentShader:`uniform sampler2D t; uniform float uS; uniform vec2 uRes; varying vec2 vUv;
    void main(){ vec2 o = vec2(uS/uRes.x, uS*0.4/uRes.y);
      vec3 c = texture2D(t, vUv).rgb; float r = texture2D(t, vUv + o).r; float b = texture2D(t, vUv - o).b;
      gl_FragColor = vec4(r, c.g, mix(c.b, b, 0.85), 1.0); }` }));
postScene.add(post);

function resize(){
  const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); rt.setSize(Math.round(w*DPR), Math.round(h*DPR));
  camera.aspect = w/h; const k = 2*Math.tan(15*Math.PI/180); camera.position.set(0, 0, Math.max((W/0.64)/(k*camera.aspect), (H/0.6)/k)); camera.updateProjectionMatrix();
  bg.material.uniforms.uRes.value.set(w*DPR, h*DPR); post.material.uniforms.uRes.value.set(w*DPR, h*DPR);
}
window.addEventListener("resize", resize); resize();

/* ── loop ── */
let last = performance.now(), lastDraw = 0;
function frame(now){
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  if (S.playing && !S.menu){ S.pos += dt; if (S.pos >= TRACKS[S.i].d) go(S.i+1); }
  if (lit && now > litUntil){ lit = null; drawWheel(); wTex.needsUpdate = true; }
  const step = REDUCED ? 0 : Math.floor(now/1000*12)/12;   // idle motion drawn on twos
  yaw += (tYaw - yaw)*Math.min(1, dt*9); pitch += (tPitch - pitch)*Math.min(1, dt*9);
  pod.rotation.set(pitch + Math.sin(step*0.9)*0.04, yaw + Math.sin(step*0.6)*0.1, Math.sin(step*0.7)*0.02);
  pod.position.y = 0.04 + Math.sin(step*1.1)*0.04;
  tilt.x *= Math.pow(0.001, dt); tilt.y *= Math.pow(0.001, dt); wheel.rotation.set(tilt.x, tilt.y, 0);
  press = Math.max(0, press - dt*5); btn.position.z = BTNZ - press*0.009;
  shift = Math.max(0, shift - dt*3);
  post.material.uniforms.uS.value = (0.7 + shift*2.2) * DPR * (REDUCED ? 0.6 : 1);
  bg.material.uniforms.uT.value = step; glassMat.uniforms.uYaw.value = pod.rotation.y;
  if (now - lastDraw > 66){ drawScreen(now); lastDraw = now; }
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}
say();
let saved = "classic"; try { saved = localStorage.getItem("cc01.look") || "classic"; } catch(e){}
Promise.all(["700 100px Sligoil","500 46px Petrona","500 20px 'Geist Mono'","700 30px 'Geist Mono'"].map(f => document.fonts.load(f))).catch(()=>{}).finally(() => {
  applyFinish(FIN[saved] ? saved : "classic");                 // also repaints the textures with the real fonts
  renderer.compile(scene, camera); doneLoading(); requestAnimationFrame(frame);
});
</script>
