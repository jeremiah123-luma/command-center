  :root{
    color-scheme:dark;
    --bg:#050505; --line:#262626; --ink:#F2F2F2; --ink2:#BDBDBD; --dim:rgba(255,255,255,.55);
    --o:#FF4D00; --grey:#E6E6E6; --y:#FFCD1A; --g:#00FF9B;
    --serif:"Petrona",Georgia,serif; --sans:"Outfit",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:16px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  h1{margin:8px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(32px,5vw,52px);letter-spacing:-.02em;line-height:1}
  h1 em{font-style:normal;color:var(--o)}
  .lede{margin:10px 0 0;color:var(--ink2);max-width:60ch}

  /* version picker */
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.07);color:#fff;
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font:500 13px var(--sans);cursor:pointer;display:flex;align-items:center;gap:7px}
  .chip b{font:500 10px var(--mono);color:var(--o)}
  .chip[aria-selected="true"]{background:#fff;color:#000;box-shadow:none}
  .chip:focus-visible,.btn:focus-visible{outline:2px solid var(--o);outline-offset:2px}

  .viewer{display:flex;flex-wrap:wrap;gap:24px 32px;align-items:flex-start}
  .info{flex:1 1 260px;display:flex;flex-direction:column;gap:12px;padding-top:4px}
  .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hd .n{font-family:var(--mono);font-size:11px;color:var(--o)}
  .hd h2{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.02em;line-height:1}
  .pick{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#000;background:var(--o);padding:2px 7px;border-radius:4px}
  .desc{margin:0;color:var(--ink2);max-width:46ch}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  .btn{height:40px;padding:0 18px;border-radius:999px;border:0;background:#fff;color:#000;font:500 14px var(--sans);cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .note{font-size:13px;color:var(--dim);margin:0}

  /* phone + app underneath */
  .ph{position:relative;flex:none;height:min(620px,64svh);aspect-ratio:290/600;max-width:100%;margin:0 auto;border-radius:40px;background:#000;overflow:hidden;isolation:isolate;
      box-shadow:0 0 0 1px #1d1d1d,0 0 0 7px #0c0c0c,0 0 0 8px #262626,0 30px 60px rgba(0,0,0,.6)}
  @media (min-width:700px){ .ph{margin:0} }
  .app{position:absolute;inset:0;padding:54px 18px 0;display:flex;flex-direction:column;gap:12px}
  .app .glow{position:absolute;inset:-20%;z-index:-1;background:radial-gradient(260px 300px at 82% 16%,rgba(255,150,70,.36),rgba(255,77,0,.28) 30%,rgba(120,28,0,.18) 58%,transparent 80%)}
  .app .lead{margin:0;font-family:var(--serif);font-size:20px;line-height:1.15;letter-spacing:-.01em}
  .app .lead em{font-style:normal;color:var(--o)}
  .app .tag{align-self:flex-start;margin-top:40px;font:500 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
  .app .disp{margin:0;font-family:var(--serif);font-size:30px;line-height:1.02;letter-spacing:-.02em}
  .app .row{height:44px;border-radius:22px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .app .dock{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:6px}
  .app .dock i{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .app .dock i:first-child{background:#fff}
  .ov{position:absolute;inset:0;background:#000;z-index:5;overflow:hidden}
  .ov canvas{position:absolute;inset:0;width:100%;height:100%}
  .ov .gl{opacity:0}
  .ov .pc{position:absolute;right:18px;bottom:22px;font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;z-index:3}
  .ov .glowb{position:absolute;left:50%;top:40%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;opacity:0;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,150,70,.42),rgba(255,77,0,.2) 42%,rgba(120,28,0,.08) 70%,transparent)}
  .logo{position:absolute;left:0;right:0;display:flex;justify-content:center;opacity:0;pointer-events:none;z-index:2}
  .logo .c1{color:var(--grey)} .logo .c2{color:var(--o)}

  .mk{position:absolute;left:0;right:0;top:46%;display:flex;justify-content:center;transform:translateY(-50%);font-family:"Sligoil",monospace;font-weight:700;opacity:0;z-index:2}
  .mk span{display:inline-block;will-change:transform,opacity}
  .mk .c1{color:var(--grey)} .mk .c2{color:var(--o)}
  .lt{position:absolute;left:50%;top:46%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;opacity:0;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,150,70,.42),rgba(255,77,0,.2) 42%,rgba(120,28,0,.08) 70%,transparent)}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Command Center 2.0 · calm intros</div>
    <h1>One mark, <em>then you're in.</em></h1>
    <p class="lede">Inspired by how the Claude app opens: one mark in the middle, a short calm move, then the app. These use your CC logo, and each lasts under two seconds.</p>
  </header>
  <div class="chips" id="chips" role="tablist" aria-label="Versions"></div>
  <div class="bar"><button class="btn" type="button" id="play">Play again</button><button class="btn ghost" type="button" id="slow">Slow motion off</button></div>
  <div class="viewer">
    <div class="ph" id="ph"></div>
    <div class="info">
      <div class="hd"><span class="n" id="vn"></span><h2 id="vname"></h2><span class="pick" id="vpick">my pick</span></div>
      <p class="desc" id="vdesc"></p>
    </div>
  </div>
</div>

<script>
(function(){
  var E="cubic-bezier(.2,.7,.2,1)", SPRING="cubic-bezier(.3,1.25,.4,1)", SLOW=1, timers=[];
  function appHTML(){ return '<div class="app"><div class="glow"></div><p class="lead"><em>Leave by 7:05.</em> Physics I at 8:30 in Science Hall 105.</p><span class="tag">Next up · PHYS 101A</span><p class="disp">Lab Report 1 is due Tuesday.</p><div class="row"></div><div class="row"></div><div class="dock"><i></i><i></i><i></i><i></i></div></div>'; }
  function stage(ph){
    ph.innerHTML=appHTML()+'<div class="ov"><div class="lt"></div><div class="mk"><span class="c1">C</span><span class="c2">C</span></div></div>';
    var ov=ph.querySelector(".ov"), W=ov.clientWidth, H=ov.clientHeight, mk=ov.querySelector(".mk");
    mk.style.fontSize=(W*.38)+"px"; mk.style.lineHeight="1";
    return {ph:ph,ov:ov,W:W,H:H,mk:mk,c1:mk.querySelector(".c1"),c2:mk.querySelector(".c2"),lt:ov.querySelector(".lt"),app:[].slice.call(ph.querySelectorAll(".app > *:not(.glow):not(.dock), .app .dock i"))}; }
  // every timing goes through here so "slow motion" can stretch it
  function A(el,kf,o){ o=Object.assign({fill:"both",easing:E},o); o.duration*=SLOW; o.delay=(o.delay||0)*SLOW; return el.animate(kf,o); }
  function at(fn,ms){ timers.push(setTimeout(fn,ms*SLOW)); }
  function reveal(s,t,o){ o=o||{};
    A(s.ov,[{opacity:1},{opacity:0}],{duration:o.d||450,delay:t,easing:"ease-in"});
    s.app.forEach(function(el,i){ A(el,[{opacity:0,transform:"translateY("+(o.rise==null?12:o.rise)+"px)"},{opacity:1,transform:"none"}],{duration:600,delay:t+120+i*60,easing:E}); });
    at(function(){ s.ov.style.display="none"; },t+(o.d||450)+20); }

  var V={};
  /* bloom: the mark comes into focus, rests, then steps back as the app arrives */
  V.bloom=function(s){
    A(s.mk,[{opacity:0,transform:"translateY(-50%) scale(.92)",filter:"blur(8px)"},{opacity:1,transform:"translateY(-50%) scale(1)",filter:"blur(0)"}],{duration:700,delay:100});
    A(s.mk,[{opacity:1,transform:"translateY(-50%) scale(1)"},{opacity:0,transform:"translateY(-50%) scale(.96)"}],{duration:360,delay:1250,easing:"ease-in",fill:"forwards"});
    reveal(s,1300); };
  /* turn: grey C lands, orange C turns a quarter into place beside it */
  V.turn=function(s){
    A(s.mk,[{opacity:0},{opacity:1}],{duration:10});
    A(s.c1,[{opacity:0},{opacity:1}],{duration:420,delay:80});
    A(s.c2,[{opacity:0,transform:"rotate(-90deg) scale(.6)"},{opacity:1,transform:"rotate(0) scale(1)"}],{duration:780,delay:200,easing:SPRING});
    A(s.mk,[{opacity:1},{opacity:0}],{duration:320,delay:1350,easing:"ease-in",fill:"forwards"});
    reveal(s,1400); };
  /* breathe: the orange C glows twice, like it's thinking, then you're in */
  V.breathe=function(s){
    A(s.mk,[{opacity:0},{opacity:1}],{duration:500,delay:80});
    A(s.c2,[{textShadow:"0 0 0 rgba(255,77,0,0)"},{textShadow:"0 0 28px rgba(255,77,0,.9)"},{textShadow:"0 0 0 rgba(255,77,0,0)"}],{duration:760,delay:450,iterations:2,easing:"ease-in-out",fill:"none"});
    A(s.lt,[{opacity:0,transform:"scale(.6)"},{opacity:.55,transform:"scale(.85)"},{opacity:0,transform:"scale(.6)"}],{duration:760,delay:450,iterations:2,easing:"ease-in-out",fill:"none"});
    A(s.mk,[{opacity:1},{opacity:0}],{duration:320,delay:2000,easing:"ease-in",fill:"forwards"});
    reveal(s,2050); };
  /* close up: the two Cs slide in from the sides and click together */
  V.close=function(s){
    A(s.mk,[{opacity:0},{opacity:1}],{duration:10});
